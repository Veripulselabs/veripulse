<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGrad2' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F172A'/>
      <stop offset='100%' stop-color='#020617'/>
    </linearGradient>
    <linearGradient id='shieldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#6366F1'/>
      <stop offset='100%' stop-color='#A855F7'/>
    </linearGradient>
    <linearGradient id='mailGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38BDF8'/>
      <stop offset='100%' stop-color='#818CF8'/>
    </linearGradient>
    <filter id='glow2' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <rect width='500' height='500' rx='100' fill='url(#bgGrad2)'/>

  <!-- Outer Concentric Pulse Rings -->
  <circle cx='250' cy='250' r='160' fill='none' stroke='#38BDF8' stroke-width='1' opacity='0.2'/>
  <circle cx='250' cy='250' r='125' fill='none' stroke='#38BDF8' stroke-width='1.5' opacity='0.4'/>

  <!-- Secure Shield Base -->
  <path d='M 250 110 C 310 110 360 130 360 130 C 360 250 310 340 250 390 C 190 340 140 250 140 130 C 140 130 190 110 250 110 Z' 
        fill='url(#shieldGrad)' opacity='0.15' stroke='url(#shieldGrad)' stroke-width='4' filter='url(#glow2)'/>

  <!-- Stylized Open Mail Envelope Body -->
  <path d='M 175 205 L 250 255 L 325 205 V 300 C 325 310 315 320 305 320 H 195 C 185 320 175 310 175 300 Z' 
        fill='none' stroke='url(#mailGrad)' stroke-width='6' stroke-linejoin='round'/>
        
  <!-- Envelope Flap / Pulse Apex -->
  <path d='M 175 205 L 250 160 L 325 205' fill='none' stroke='url(#mailGrad)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/>

  <!-- Glowing Verification Check badge -->
  <circle cx='250' cy='265' r='24' fill='#090D16' stroke='#38BDF8' stroke-width='4'/>
  <path d='M 238 265 L 246 273 L 263 255' fill='none' stroke='#38BDF8' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/>
</svg>