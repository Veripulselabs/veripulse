<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#090D16'/>
      <stop offset='100%' stop-color='#141C2E'/>
    </linearGradient>
    <linearGradient id='pulseGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#00F2FE'/>
      <stop offset='100%' stop-color='#4FACFE'/>
    </linearGradient>
    <linearGradient id='checkGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#00F2FE'/>
      <stop offset='100%' stop-color='#00C9FF'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='12' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <rect width='500' height='500' rx='100' fill='url(#bgGrad)'/>
  
  <!-- Subtle grid lines representing verification network -->
  <path d='M 100 250 H 400 M 250 100 V 400' stroke='#1E293B' stroke-width='2' stroke-dasharray='6 6'/>
  <circle cx='250' cy='250' r='140' fill='none' stroke='#1E293B' stroke-width='1.5'/>

  <!-- Pulsing ECG / Data Wave -->
  <path d='M 70 250 L 160 250 L 190 190 L 230 330 L 270 170 L 310 290 L 340 250 L 430 250' 
        fill='none' stroke='url(#pulseGrad)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' filter='url(#glow)'/>

  <!-- Floating Secure Envelope / Shield Badge Center -->
  <circle cx='250' cy='250' r='55' fill='#0F172A' stroke='#00F2FE' stroke-width='3' filter='url(#glow)'/>
  
  <!-- Precision Checkmark -->
  <path d='M 225 250 L 242 268 L 278 230' fill='none' stroke='url(#checkGrad)' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/>
</svg>