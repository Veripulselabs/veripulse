<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="300" rx="16" fill="url(#bgGrad)" />
  <g transform="translate(80, 40)">
    <path d="M80 15 L145 45 V100 C145 155 80 185 80 185 C80 185 15 155 15 100 V45 Z" fill="#0A192F" stroke="#38BDF8" stroke-width="2.5" opacity="0.8" />
    <path d="M 35 100 L 58 100 L 68 78 L 80 135 L 98 55 L 112 115 L 122 100 L 140 100" fill="none" stroke="url(#pulseGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <circle cx="98" cy="55" r="5" fill="#34D399" filter="url(#glow)" />
    <text x="190" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" fill="#38BDF8" letter-spacing="3">VERIPULSE</text>
    <text x="192" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="700" fill="#34D399" letter-spacing="8">LABS</text>
  </g>
